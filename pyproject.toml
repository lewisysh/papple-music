[project]
name = "papple-music"
version = "0.1.0"
description = "Papple Music - a friendly web GUI for gamdl with wrapper-v2 (ALAC) support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gamdl>=3.9.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.28.1",
    "structlog>=25.5.0",
]

[project.scripts]
papple-music = "gamdl_web.__main__:main"
gamdl-web = "gamdl_web.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gamdl_web"]

[dependency-groups]
app = [
    "imageio-ffmpeg>=0.6.0",
    "pyinstaller>=6.22.3",
    "pyobjc-framework-cocoa>=12.2.2",
]
