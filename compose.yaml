# wrapper: built from vendor/wrapper-v2 by scripts/setup-wrapper.sh.
# papple-music: optional containerized web UI, start with `docker compose --profile web up -d`.
services:
  wrapper:
    build:
      context: ./vendor/wrapper-v2
      args:
        TARGET_ARCH: ${TARGET_ARCH:-arm64-v8a}
        RUNTIME_PLATFORM: ${RUNTIME_PLATFORM:-linux/arm64}
    image: wrapper-v2:latest
    container_name: wrapper-v2
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    ports:
      - "127.0.0.1:${WRAPPER_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${WRAPPER_DECRYPT_PORT:-10020}:10020"
    volumes:
      # Keeps the Apple login session across container restarts.
      - ./data/wrapper:/app/rootfs/data/data/com.apple.android.music/files

  papple-music:
    profiles: ["web"]
    build: .
    container_name: papple-music
    restart: unless-stopped
    depends_on:
      - wrapper
    environment:
      GAMDL_WEB_HOST: 0.0.0.0
      GAMDL_WEB_PASSWORD: ${GAMDL_WEB_PASSWORD:-}
      # The port below is published on the host's loopback only; without a
      # password the app also only answers to localhost / 127.0.0.1 hosts.
      GAMDL_WEB_ALLOW_NO_PASSWORD: "1"
      GAMDL_WEB_DATA_DIR: /data
      GAMDL_WEB_OUTPUT_PATH: /downloads
      GAMDL_WEB_USE_WRAPPER: "1"
      GAMDL_WEB_WRAPPER_URL: http://wrapper
      GAMDL_WEB_WRAPPER_DECRYPT_HOST: wrapper
      GAMDL_WEB_WRAPPER_DECRYPT_PORT: "10020"
    ports:
      - "127.0.0.1:${GAMDL_WEB_PORT:-18765}:18765"
    volumes:
      - ./data/web:/data
      - ${GAMDL_WEB_DOWNLOADS:-./downloads}:/downloads
